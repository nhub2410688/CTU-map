<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Thời khóa biểu - CTU MAP</title>

<body id="top">
    <header id="siteHeader"></header>

    <main class="page-shell">
        <h1 class="page-title">Thời khóa biểu sinh viên</h1>
        <div class="stack">
            <section class="panel">
                <h2 id="scheduleFormTitle">Thêm lớp học</h2>
                <form id="scheduleForm" onsubmit="saveSchedule(event)">
                    <!-- Ô lọc môn học -->
                    <div class="field">
                        <label for="subjectFilter">Lọc theo môn học</label>
                        <input id="subjectFilter" list="subjectList" placeholder="Gõ mã hoặc tên môn học...">
                        <datalist id="subjectList"></datalist>
                    </div>

                    <!-- Dropdown chọn lớp (sẽ được lọc theo môn) -->
                    <div class="field">
                        <label for="teacherScheduleId">Chọn lớp học</label>
                        <select id="teacherScheduleId" required>
                            <option value="">Chọn lớp học</option>
                        </select>
                    </div>

                    <div class="actions">
                        <button id="scheduleSubmit" type="submit">Thêm vào TKB</button>
                        <button id="scheduleCancel" class="secondary hidden" type="button" onclick="cancelScheduleEdit()">Hủy sửa</button>
                    </div>
                </form>
                <p class="muted">Gõ mã/tên môn để lọc lớp, sau đó chọn lớp của giảng viên muốn học.</p>
                <div id="scheduleStatus" class="status"></div>
            </section>

            <section class="panel">
                <h2>Thời khóa biểu</h2>
                <div id="scheduleTable" class="table-wrap"></div>
            </section>
