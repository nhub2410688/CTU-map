<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch giảng viên - CTU MAP</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .session-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.2fr auto;
            gap: 8px;
            align-items: end;
            margin-bottom: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .session-row .field { margin: 0; }
        .session-row label { font-size: 0.85em; }
        #sessionsList { margin: 12px 0; }
        .searchable-wrap { position: relative; }
        .searchable-wrap input { width: 100%; }
        .searchable-list {
            position: absolute;
            z-index: 20;
            left: 0; right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: none;
        }
        .searchable-list.show { display: block; }
        .searchable-list div {
            padding: 6px 10px;
            cursor: pointer;
        }
        .searchable-list div:hover, .searchable-list div.active {
            background: #e8f0fe;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filter-row .field { flex: 1; min-width: 140px; }
        .sessions-cell { font-size: 0.9em; line-height: 1.4; }
    </style>
</head>
<body id="top">
    <header id="siteHeader"></header>

    <main class="page-shell">
        <h1 class="page-title">Lịch giảng dạy và lớp học</h1>
        <div id="teacherTabs" class="section-tabs hidden">
            <button class="active" type="button" data-tab="subjects" onclick="showTeacherTab('subjects')">Danh mục môn học</button>
            <button type="button" data-tab="teachers" onclick="showTeacherTab('teachers')">Danh sách giảng viên</button>
            <button type="button" data-tab="classes" onclick="showTeacherTab('classes')">Danh sách lớp học</button>
        </div>
        <div class="stack">
            <section id="subjectAdminPanel" class="panel hidden" data-teacher-tab="subjects">
                <h2 id="subjectFormTitle">Danh mục môn học</h2>
                <form id="subjectForm" onsubmit="saveSubject(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="subjectCode">Mã môn học</label>
                            <input id="subjectCode" placeholder="CT101" required>
                        </div>
                        <div class="field">
                            <label for="subjectName">Tên môn học</label>
                            <input id="subjectName" required>
                        </div>
                    </div>
                    <div class="actions-bar">
                        <div class="actions-left">
                            <button id="subjectSubmit" type="submit">Thêm môn học</button>
                            <button id="subjectCancel" class="secondary hidden" type="button" onclick="cancelSubjectEdit()">Hủy sửa</button>
                        </div>
                        <div class="field filter-field">
                            <input id="subjectSearch" placeholder="Lọc: mã hoặc tên môn học...">
                        </div>
                    </div>
                    <br>
                </form>
                <div id="subjectStatus" class="status"></div>
                <div id="subjectTable" class="table-wrap"></div>
            </section>

            <section id="teacherAdminPanel" class="panel hidden" data-teacher-tab="teachers">
                <h2 id="teacherFormTitle">Danh sách giảng viên</h2>
                <form id="teacherForm" onsubmit="saveTeacher(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="teacherCode">Mã giảng viên</label>
                            <input id="teacherCode" placeholder="GV001" required>
                        </div>
                        <div class="field">
                            <label for="teacherName">Tên giảng viên</label>
                            <input id="teacherName" required>
                        </div>
                    </div>
                    <div class="actions-bar">
                        <div class="actions-left">
                            <button id="teacherSubmit" type="submit">Thêm giảng viên</button>
                            <button id="teacherCancel" class="secondary hidden" type="button" onclick="cancelTeacherEdit()">Hủy sửa</button>
                        </div>
                        <div class="field filter-field">
                            <input id="teacherSearch" placeholder="Lọc: mã hoặc tên giảng viên...">
                        </div>
                    </div>
                    <br>
                </form>
                <div id="teacherStatus" class="status"></div>
                <div id="teacherListTable" class="table-wrap"></div>
            </section>

            <section id="classAdminPanel" class="panel hidden" data-teacher-tab="classes">
                <h2 id="classFormTitle">Thêm lớp học</h2>
                <form id="classForm" onsubmit="saveClass(event)">
                    <div class="form-grid">
                        <div class="field">
                            <label for="classCode">Mã lớp</label>
                            <input id="classCode" placeholder="CT10101" required>
                        </div>
                        <div class="field">
                            <label for="classTeacherInput">Giảng viên</label>
                            <div class="searchable-wrap">
                                <input id="classTeacherInput" placeholder="Gõ mã hoặc tên giảng viên..." autocomplete="off" required>
                                <input type="hidden" id="classTeacher">
                                <div id="classTeacherList" class="searchable-list"></div>
                            </div>
                        </div>
                        <div class="field">
                            <label for="classSubjectInput">Môn học</label>
                            <div class="searchable-wrap">
                                <input id="classSubjectInput" placeholder="Gõ mã hoặc tên môn học..." autocomplete="off" required>
                                <input type="hidden" id="classSubject">
                                <div id="classSubjectList" class="searchable-list"></div>
                            </div>
                        </div>
                    </div>

                    <h3 style="margin:16px 0 8px;font-size:1rem;">Các buổi học</h3>
                    <div id="sessionsList"></div>
                    <button type="button" class="secondary small" onclick="addSessionRow()">+ Thêm buổi học</button>

                    <div class="actions-bar" style="margin-top:16px;">
                        <div class="actions-left">
                            <button id="classSubmit" type="submit">Thêm lớp học</button>
                            <button id="classCancel" class="secondary hidden" type="button" onclick="cancelClassEdit()">Hủy sửa</button>
                        </div>
                    </div>
                    <div id="classStatus" class="status"></div>
                </form>
            </section>

            <section id="classListPanel" class="panel" data-teacher-tab="classes">
                <h2>Danh sách lớp học</h2>
                <div class="filter-row">
                    <div class="field">
                        <input id="classSearch" placeholder="Lọc: mã lớp, môn, giảng viên...">
                    </div>
                </div>
                <div id="classTable" class="table-wrap"></div>
            </section>
        </div>
    </main>

    <div id="siteFooter"></div>
    <script src="js/common.js"></script>
    <script src="js/teachers.js"></script>
</body>
</html>
